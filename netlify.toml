[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/google-reviews"
  to = "/.netlify/functions/google-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/inspections"
  to = "/add-on"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
