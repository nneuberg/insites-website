[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/google-reviews"
  to = "/.netlify/functions/google-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/inspections"
  to = "/add-on"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/refer"
  to = "/referral/"
  status = 301
  force = true

[[headers]]
  for = "/referral*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
