name: Publish final website updates
on:
  push:
    paths:
      - '.github/workflows/publish-final.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply finished website files
        run: |
          python3 - <<'PY'
          import base64, gzip, json, pathlib
          files = json.loads(gzip.decompress(base64.b64decode("""""")).decode())
          for rel, data in files.items():
              path = pathlib.Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(data))
          pathlib.Path('.github/workflows/publish-final.yml').unlink()
          PY
          git config user.name "Codex Website Publisher"
          git config user.email "neal@insites.services"
          git add -A
          git commit -m "Publish coupon, branding, and email delivery"
          git push
